services:
  neo4j:
    image: neo4j:5-community
    container_name: dados_de_bancos_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/banco1984
    volumes:
      - neo4j_data:/data
      - ./cypher:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  neo4j_data: